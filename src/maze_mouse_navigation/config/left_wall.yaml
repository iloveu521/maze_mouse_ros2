maze_navigator:
  ros__parameters:
    use_sim_time: true
    start_x: 0.5
    start_y: 0.5
    start_yaw: 0.0
    goal_x: 6.45
    goal_y: 5.5
    goal_yaw: 0.0
    goal_tolerance: 0.14
    sector_width_deg: 30.0
    cell_size: 1.0  # local junction de-duplication only; no maze map/search
    max_linear_speed: 0.5  # Gazebo straight-line target, m/s
    approach_speed: 0.20
    desired_left_distance: 0.40
    opening_distance: 0.78
    opening_scans: 2
    front_turn_distance: 0.82
    front_stop_distance: 0.20
    side_stop_distance: 0.14
    max_angular_speed: 0.6
    linear_acceleration: 0.8
    linear_deceleration: 1.2
    heading_gain: 1.6
    wall_gain: 1.5
    angular_damping: 0.25
    data_timeout: 0.7
