# 0.5 m/s speed profile with the same 14 m fixed global grid.
/maze_navigator:
  ros__parameters:
    use_sim_time: true
    start_x: -4.5
    start_y: -3.44
    start_yaw: 0.0
    goal_x: 5.45
    goal_y: 3.49
    goal_tolerance: 0.14
    # ---- 速度与运动模型（0.5 m/s 保守档）----
    max_linear_speed: 0.5       # 线速度指令上限 (m/s)
    max_angular_speed: 0.9      # 角速度指令上限 (rad/s)
    linear_acceleration: 0.8    # 预测/采样用线加速度 (m/s^2)
    linear_deceleration: 1.0    # 预测/采样用线减速度 (m/s^2)；也用于走廊停止距离限速
    angular_acceleration: 1.5   # 预测/采样用角加速度 (rad/s^2)
    prediction_horizon: 1.5     # 轨迹预测时长 (s)
    reaction_time: 0.2          # 执行/通信延迟预算 (s)
    side_sector_width_deg: 60.0
    front_sector_width_deg: 90.0
    minimum_wall_length: 0.24
    wall_fit_tolerance: 0.025
    data_timeout: 0.7
    costmap_resolution: 0.05
    costmap_size: 14.0
    costmap_fixed: true
    robot_radius: 0.14
    inflation_margin: 0.04
    soft_cost_radius: 0.0
    laser_offset_x: -0.032
    laser_offset_y: 0.0
    laser_yaw: 0.0
    heading_stop_angle: 1.2
    clearance_weight: 1.0
    progress_weight: 4.0
    path_weight: 1.5
    heading_weight: 0.7
    speed_weight: 1.0           # 速度候选评分中的速度偏好权重
    linear_samples: 6           # 线速度采样数
    angular_samples: 30         # 角速度采样数
    pursuit_lookahead: 0.35        # 基础 Pure Pursuit 前瞻距离 (m)
    pursuit_lookahead_gain: 0.15   # 随速度增加的前瞻 (s)
    pursuit_lookahead_max: 0.55    # 前瞻上限 (m)
    path_preview_distance: 1.20
    path_validation_distance: 1.25
    path_deviation: 0.35
    heading_kp: 0.85
    curvature_feedforward: 1.0
    max_lateral_acceleration: 0.40  # 弯道横向加速度上限 (m/s^2)，决定弯道线速度
    angular_command_acceleration: 1.8  # 角速度指令变化率上限 (rad/s^2)
    pursuit_weight: 4.0
    replan_period: 0.6
    frontier_weight: 2.5
    frontier_min_distance: 0.4
    frontier_switch_margin: 0.3
    frontier_sticky_radius: 0.6
    frontier_sticky_bonus: 0.5
    start_snap_radius: 0.4
    goal_snap_radius: 0.12
    planning_margin: 0.05
    clearance_cost_weight: 5.0
    clearance_target: 0.45
    planner_path_min_remaining: 0.4
    planner_path_deviation: 0.35
    planner_path_validation_distance: 1.0
    smoothing_span: 1.5
    smoothing_clearance: 0.32
